version: 2

project_name: git-courer

before:
  hooks:
    - go mod tidy

# Solo linux/amd64 se buildea acá porque CGO no cross-compila.
# darwin/amd64, darwin/arm64, windows/amd64 se buildan en runners nativos
# y se suben aparte vía gh release upload.
builds:
  - main: ./cmd/main.go
    binary: git-courer
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X github.com/blak0p/git-courer/internal/config.ServerVersion={{.Version}}
    flags:
      - -trimpath
    hooks:
      post:
        - upx --ultra-brute "{{ .Path }}"

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

release:
  prerelease: auto
  mode: keep-existing
  header: |
    ## {{ .TagSubject }}

    {{ .TagBody }}
  footer: |
    ---

    **Full Changelog**: https://github.com/blak0p/git-courer/compare/{{ .PreviousTag }}...{{ .Tag }}

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

brews:
  - repository:
      owner: blak0p
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    name: git-courer
    homepage: "https://github.com/blak0p/git-courer"
    description: "AI-powered local git operations via MCP. Zero cloud tokens for git."
    license: "MIT"
    commit_msg_template: "chore: update git-courer formula to {{ .Tag }}"
    test: |
      system "#{bin}/git-courer --version"
