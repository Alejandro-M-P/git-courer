ollama:
  host: http://localhost:11434
  model: gemma4:26b
  context_window: 0
  auto_start: false
  models_dir: ""

git:
  workdir: .
  auto_add_secrets: true
  require_clean_repo: false

secrets:
  detection_mode: regex+ai
  patterns:
    - "*.key"
    - "*.pem"
    - ".env*"
    - "credentials.json"
    - "secrets.yaml"
    - "*.password"
    - "*.token"

preview:
  enabled: true
  operations:
    commit: true
    branch_create: true
    branch_delete: true
    release: true
    tag_create: false
    tag_delete: false
    tag_push: false
    tag_delete_remote: false

commit:
  ttl: 10m
  log_path: .gcourer/task.log
  max_log_lines: 500

release:
  log_path: .gcourer/release.log
  max_log_lines: 500
  max_commits_per_chunk: 20
  create_github_release: false        # Set true to create GitHub release via gh CLI
  changelog_output_path: .gcourer/changelog-generated.md  # For GoReleaser/readable changelog

commands:
  enabled_operations:
    - commit
    - release
    - push
    - pull
    - branch_create
    - branch_delete
    - merge
    - tag_create        # uncomment to enable
    - tag_delete        # uncomment to enable
    - tag_push          # uncomment to enable
    - tag_delete_remote # uncomment to enable

backup:
  enabled: true
