ollama:
  host: http://localhost:11434
  model: qwen3.5
  context_window: 0
  auto_start: false
  models_dir: ""

git:
  workdir: .
  auto_add_secrets: true
  require_clean_repo: false

validation:
  require_confirmation: true
  confirmation_method: elicitation  # elicitation | auto
  max_commit_length: 72

secrets:
  detection_mode: regex+ai
  patterns: []

ui:
  theme: dark
  show_icons: true

mcp:
  name: git-courer
  version: ""

preview:
  enabled: true
  operations:
    commit: true
    branch_create: true
    branch_delete: true
    release: true
    tag_create: false
    tag_delete: false

commands:
  enabled_operations:
    - commit
    - release
    - push
    - pull
    - branch_create
    - branch_delete
    - merge
    # - tag_create   # uncomment to enable
    # - tag_delete  # uncomment to enable

backup:
  enabled: true
