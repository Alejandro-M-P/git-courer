name: Bug Report
description: Report a bug to help us improve git-courer
title: "package: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: input
    id: version
    attributes:
      label: Version
      description: Run `git-courer version`
      placeholder: "git-courer version v0.1.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "macOS 15.4 / Ubuntu 24.04 / Windows 11"
    validations:
      required: true

  - type: input
    id: ai-tool
    attributes:
      label: AI Tool
      description: Which AI tool are you using with git-courer? (Claude Code, Cursor, OpenCode, etc.)
      placeholder: "Claude Code 0.3.0"
    validations:
      required: true

  - type: input
    id: llm-model
    attributes:
      label: LLM Model
      description: Which model / LLM backend are you using? (Ollama + gemma4:26b, OpenAI + gpt-4o, etc.)
      placeholder: "Ollama + gemma4:26b"
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the issue and what you expected to happen.
      placeholder: "Tell us what went wrong"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run 'git-courer ...'
        2. ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any error messages or logs.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: search
    attributes:
      label: Search
      options:
        - label: |
            I searched for existing open and closed issues before opening this
          required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
    validations:
      required: false
