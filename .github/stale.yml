# Number of days of inactivity before an issue/PR becomes stale
daysUntilStale: 60
# Number of days of inactivity before a stale issue/PR is closed
daysUntilClose: 14
# Issues/PRs with these labels will never be considered stale
exemptLabels:
  - security
  - never-stale
  - planned
# Label to use when marking as stale
staleLabel: stale
# Comment to post when marking as stale
markComment: >
  This has been automatically marked as stale because it has not had recent
  activity. It will be closed if no further activity occurs within 14 days.
  Thank you for your contribution.
# Comment to post when closing a stale issue/PR
closeComment: false
