name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (amd64 + arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download FFI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/update-ffi.sh
          ./scripts/update-ffi.sh

      - name: Build amd64
        run: |
          CGO_ENABLED=1 go build -ldflags "-s -w -X github.com/blak0p/git-courer/internal/config.ServerVersion=${{ github.ref_name }}" -o git-courer-darwin-amd64 ./cmd/main.go

      - name: Build arm64
        run: |
          CGO_ENABLED=1 GOARCH=arm64 go build -ldflags "-s -w -X github.com/blak0p/git-courer/internal/config.ServerVersion=${{ github.ref_name }}" -o git-courer-darwin-arm64 ./cmd/main.go

      - uses: actions/upload-artifact@v4
        with:
          name: binary-darwin-amd64
          path: git-courer-darwin-amd64

      - uses: actions/upload-artifact@v4
        with:
          name: binary-darwin-arm64
          path: git-courer-darwin-arm64

  build-linux:
    name: Build Linux amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download FFI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/update-ffi.sh
          ./scripts/update-ffi.sh

      - name: Build Binary
        run: |
          CGO_ENABLED=1 go build -ldflags "-s -w -X github.com/blak0p/git-courer/internal/config.ServerVersion=${{ github.ref_name }}" -o git-courer-linux-amd64 ./cmd/main.go

      - uses: actions/upload-artifact@v4
        with:
          name: binary-linux-amd64
          path: git-courer-linux-amd64

  release:
    name: Release
    needs:
      - build-linux
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # actions/checkout does not fetch annotated tag metadata on tag
      # push triggers (bug #290). This explicit fetch ensures
      # goreleaser can use .TagSubject / .TagBody from annotated tags.
      - name: Fetch annotated tag metadata
        run: git fetch --force --tags

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download FFI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/update-ffi.sh
          ./scripts/update-ffi.sh

      # Goreleaser builds the Linux binary natively (CGO works on
      # ubuntu-latest). macOS and Windows binaries are built in
      # separate jobs above and uploaded after the release is created.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Download macOS & Windows binaries
        uses: actions/download-artifact@v4
        with:
          path: native-binaries
          pattern: binary-*
          merge-multiple: true

      - name: Upload native macOS & Windows binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" native-binaries/* --clobber
