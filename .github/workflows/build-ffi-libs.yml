name: Update FFI Libraries

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ffi:
    name: Download & Update FFI Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Update Script
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/update-ffi.sh

      - name: Commit and Push Libraries
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f target/release/linux_amd64/libts_pack_core_ffi.a
          git add -f target/release/darwin_amd64/libts_pack_core_ffi.a
          git add -f target/release/darwin_arm64/libts_pack_core_ffi.a
          git add -f target/release/windows_amd64/libts_pack_core_ffi.a
          git add internal/infra/chunkers/ext_lib/include/ts_pack.h
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes in FFI libraries."
          else
            git commit -m "chore(ci): update precompiled FFI libraries to latest version"
            git push origin HEAD:${{ github.ref }}
          fi
