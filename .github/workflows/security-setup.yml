name: Security Setup

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  security-setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      repository-projects: write
      security-events: write
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CODEOWNERS
        run: |
          cat > CODEOWNERS << 'EOF'
          # Default owner
          * @Alejandro-M-P

          # Code owners for specific paths
          /internal/core/ @Alejandro-M-P
          /internal/app/commit/ @Alejandro-M-P
          /internal/infra/mcp/ @Alejandro-M-P
          EOF

      - name: Configure branch protection
        run: |
          # Enable branch protection via GitHub API
          curl -s -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/branches/main/protection \
            -f '{
              "required_status_checks": {
                "strict": true,
                "contexts": ["test", "build"]
              },
              "enforce_admins": true,
              "required_pull_request_reviews": {
                "required_approving_review_count": 1,
                "dismiss_stale_reviews": true,
                "require_code_owner_reviews": true
              },
              "restrictions": null,
              "allow_force_pushes": false,
              "allow_deletions": false,
              "block_creations": false,
              "required_conversation_resolution": true
            }'

      - name: Configure repository settings
        run: |
          # Enable required pull request reviews
          curl -s -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }} \
            -f '{
              "allow_auto_merge": false,
              "allow_merge_commit": true,
              "allow_rebase_merge": true,
              "allow_squash_merge": true,
              "delete_branch_on_merge": true
            }'

      - name: Commit CODEOWNERS
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: add CODEOWNERS file"
          file_pattern: CODEOWNERS
