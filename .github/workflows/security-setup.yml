name: Security Setup

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      repository-projects: admin
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CODEOWNERS
        run: |
          cat > CODEOWNERS << 'EOF'
          # Default owner
          * @Alejandro-M-P

          # Core domain and ports
          /internal/core/ @Alejandro-M-P

          # Commit flow
          /internal/app/commit/ @Alejandro-M-P

          # MCP server
          /internal/infra/mcp/ @Alejandro-M-P

          # Security
          /internal/app/security/ @Alejandro-M-P
          /internal/infra/secrets/ @Alejandro-M-P
          EOF

      - name: Commit CODEOWNERS
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: add CODEOWNERS file"
          file_pattern: CODEOWNERS

      - name: Configure branch protection
        run: |
          # Use gh CLI to configure branch protection
          gh api --method PUT /repos/Alejandro-M-P/git-courer/branches/main/protection \
            -H "Accept: application/vnd.github+json" \
            -f required_status_checks='{"strict":true,"contexts":["test","build"]}' \
            -f enforce_admins=true \
            -f required_pull_request_reviews='{"required_approving_review_count":1,"dismiss_stale_reviews":true,"require_code_owner_reviews":true}' \
            -f restrictions=null \
            -f allow_force_pushes=false \
            -f allow_deletions=false \
            -f block_creations=false \
            -f required_conversation_resolution=true

      - name: Configure repository
        run: |
          gh repo edit Alejandro-M-P/git-courer \
            --delete-branch-on-merge \
            --enable-squash-merge \
            --enable-rebase-merge \
            --enable-merge-commit
